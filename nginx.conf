server {
    listen ${PORT};
    client_max_body_size 12m;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host $proxy_host;
    
    # Redirigir el tráfico del frontend a los archivos de Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto es crucial para SPAs (Angular/React), redirige todas las rutas a index.html
        try_files $uri $uri/ /index.html;
    }

    # Redirigir llamadas a la API hacia el contenedor del backend
    location /api/ {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass ${BACKEND_ORIGIN}/api/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirigir llamadas a la documentación de Swagger
    location /docs {
        proxy_pass ${BACKEND_ORIGIN}/docs;
    }

    location /openapi.json {
        proxy_pass ${BACKEND_ORIGIN}/openapi.json;
    }

    # Redirigir llamadas a las imágenes estáticas (Uploads)
    location /uploads/ {
        proxy_pass ${BACKEND_ORIGIN}/uploads/;
    }
}
